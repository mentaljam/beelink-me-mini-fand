name: Linux packages

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false

      - name: Install nFPM
        run: |
          archive=nfpm_2.49.0_Linux_x86_64.tar.gz
          curl --fail --silent --show-error --location \
            "https://github.com/goreleaser/nfpm/releases/download/v2.49.0/$archive" \
            --output "$RUNNER_TEMP/$archive"
          printf '%s  %s\n' 2afaa5ffb5e3493402e31e7c67a5a1fb42133e3f66fc315ca0051934125561c7 \
            "$RUNNER_TEMP/$archive" | sha256sum --check
          tar -xzf "$RUNNER_TEMP/$archive" -C "$RUNNER_TEMP" nfpm

      - name: Build packages
        env:
          CC: gcc
          CFLAGS: -O3 -march=x86-64-v3 -mtune=alderlake
          NFPM: ${{ runner.temp }}/nfpm
        run: make packages VERSION="${GITHUB_REF_NAME#v}"

      - uses: actions/upload-artifact@v7.0.2
        with:
          name: packages
          path: build/packages/
          if-no-files-found: error

  release:
    needs: build
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v8.0.2
        with:
          name: packages
          path: packages

      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" packages/* \
            --repo "$GITHUB_REPOSITORY" --verify-tag --generate-notes
